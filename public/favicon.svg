  <g fill="none" stroke="white" stroke-linecap="round" stroke-linejoin="round">
    <!-- Left page -->
    <path d="M32 20 C26 18 18 19 14 22 L14 46 C18 43 26 42 32 44 Z" fill="rgba(255,255,255,0.15)" stroke="white" stroke-width="2"/>
    <!-- Right page -->
    <path d="M32 20 C38 18 46 19 50 22 L50 46 C46 43 38 42 32 44 Z" fill="rgba(255,255,255,0.15)" stroke="white" stroke-width="2"/>
    <!-- Spine -->
    <line x1="32" y1="20" x2="32" y2="44" stroke="white" stroke-width="2"/>
    <!-- Lines on left page -->
    <line x1="19" y1="28" x2="29" y2="27" stroke="white" stroke-width="1.5" opacity="0.8"/>
    <line x1="19" y1="33" x2="29" y2="32" stroke="white" stroke-width="1.5" opacity="0.8"/>
    <line x1="19" y1="38" x2="29" y2="37" stroke="white" stroke-width="1.5" opacity="0.8"/>
    <!-- Lines on right page -->
    <line x1="35" y1="27" x2="45" y2="28" stroke="white" stroke-width="1.5" opacity="0.8"/>
    <line x1="35" y1="32" x2="45" y2="33" stroke="white" stroke-width="1.5" opacity="0.8"/>
    <line x1="35" y1="37" x2="45" y2="38" stroke="white" stroke-width="1.5" opacity="0.8"/>
  </g>
</svg>
